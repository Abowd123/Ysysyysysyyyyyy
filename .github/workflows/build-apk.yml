name: Build ColorLand

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to publish the APK on the repository's Releases page.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg (needed to encode music to .ogg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2

      - name: Generate binary assets (sounds, music, icons, font)
        run: bash tools/gen_binaries.sh

      - name: Check coloring assets (closed paths, sizes, labels)
        run: python tools/art/check_assets.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files (keeps existing lib/, assets/, test/)
        run: flutter create . --platforms=android --org com.colorland --project-name colorland

      - name: App name, icon, splash, permissions, R8 keep rules
        run: python3 tools/release/prepare_android.py

      - name: Release signing (only if the KEYSTORE secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No keystore secret: using debug signing (fine for testing)."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
          G=$(ls android/app/build.gradle.kts 2>/dev/null || ls android/app/build.gradle)
          python3 tools/release/apply_signing.py "$G" upload.jks "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD"

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Build APKs (one per CPU type + universal)
        run: |
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Build App Bundle (for Google Play)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Size report
        run: ls -lh build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: colorland-apk
          path: build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: colorland-aab
          path: build/app/outputs/bundle/release/*.aab

      - name: Prepare release files
        id: rel
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "tag=v$V-build$GITHUB_RUN_NUMBER" >> $GITHUB_OUTPUT
          echo "version=$V" >> $GITHUB_OUTPUT
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/ColorLand.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/ColorLand-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/ColorLand-arm32.apk
          cp build/app/outputs/bundle/release/app-release.aab release/ColorLand.aab

      - name: Publish on the Releases page (download link in README)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ColorLand ${{ steps.rel.outputs.version }} (build ${{ github.run_number }})
          make_latest: true
          body: |
            ## 🎨 ColorLand – عالم الألوان ${{ steps.rel.outputs.version }}
            **للتثبيت على الجوال حمّل `ColorLand.apk`** (يعمل على كل الأجهزة).
            - `ColorLand-arm64.apk`: أصغر، لأغلب الجوالات الحديثة.
            - `ColorLand-arm32.apk`: للجوالات القديمة.
            - `ColorLand.aab`: لرفعه على Google Play فقط.
          files: release/*

