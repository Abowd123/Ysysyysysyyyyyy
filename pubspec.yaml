name: colorland
description: "ColorLand - عالم الألوان. Offline coloring world for kids 3-10."
publish_to: 'none'
version: 1.1.1+12

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  xml: ^6.5.0
  path_drawing: ^1.0.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  gal: ^2.3.0
  flutter_soloud: ">=2.1.0 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/drawings/
    - assets/audio/sfx/
    - assets/audio/music/
  fonts:
    - family: Baloo
      fonts:
        - asset: assets/fonts/BalooBhaijaan2.ttf
